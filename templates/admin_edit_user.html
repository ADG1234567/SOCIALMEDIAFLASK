{% extends 'layout.html' %}
{% block title %}Editar usuario{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Editar usuario</h2>
    <form action="{{ url_for('admin_edit_user', user_id=user[0]) }}" method="post">
        <label>Nombre</label>
        <input type="text" name="name" value="{{ user[1] }}" required>
        <label>Correo</label>
        <input type="email" name="email" value="{{ user[2] }}" required>
        <label>Contraseña nueva</label>
        <input type="password" name="password">
        <label>Es administrador</label>
        <input type="checkbox" name="is_admin" value="1" {% if user[3] %}checked{% endif %}>
        <button type="submit" class="primary-button">Guardar usuario</button>
    </form>
</div>
{% endblock %}
